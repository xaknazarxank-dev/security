name: Security Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Минимальные права по умолчанию
permissions:
  contents: read
  security-events: write

jobs:
  # ─── 1. SAST: Semgrep ──────────────────────────────────────────────────────
  sast:
    name: "SAST — Semgrep"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/owasp-top-ten
            p/secrets
            p/fastapi
          # Pipeline падает при Critical (ERROR) уязвимостях
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

      - name: Save Semgrep report
        if: always()
        run: |
          pip install semgrep
          semgrep --config=p/python --config=p/owasp-top-ten \
                  --json --output=semgrep-results.json . || true
          semgrep --config=p/python --config=p/owasp-top-ten \
                  --severity=ERROR . && echo "✅ No Critical findings" \
                  || (echo "❌ Critical findings found — blocking pipeline" && exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-results.json

  # ─── 2. Secrets Scan: Gitleaks ─────────────────────────────────────────────
  secrets-scan:
    name: "Secrets — Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Полная история для сканирования всех коммитов

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gitleaks возвращает exit-code 1 при находке секретов → pipeline падает

  # ─── 3. Dependency Scan: Trivy ─────────────────────────────────────────────
  dependency-scan:
    name: "Dependencies — Trivy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan requirements.txt
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          exit-code: "1"           # Падаем при Critical/High CVE
          format: "table"
          output: "trivy-deps.txt"

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-dependency-report
          path: trivy-deps.txt

  # ─── 4. Docker Build + Image Scan ──────────────────────────────────────────
  docker-scan:
    name: "Docker — Build & Scan"
    runs-on: ubuntu-latest
    needs: [sast, secrets-scan, dependency-scan]   # Только после прохождения проверок
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t secureapp:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secureapp:${{ github.sha }}"
          format: "sarif"
          output: "trivy-image.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"           # Падаем при Critical/High в образе

      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif

      - name: Verify non-root user in container
        run: |
          USER=$(docker run --rm secureapp:${{ github.sha }} whoami)
          echo "Container runs as: $USER"
          [ "$USER" != "root" ] || (echo "❌ Container runs as root!" && exit 1)
          echo "✅ Container runs as non-root: $USER"

  # ─── 5. Summary ────────────────────────────────────────────────────────────
  pipeline-summary:
    name: "✅ Security Gates Passed"
    runs-on: ubuntu-latest
    needs: [sast, secrets-scan, dependency-scan, docker-scan]
    if: success()
    steps:
      - name: All security gates passed
        run: |
          echo "============================================"
          echo "✅ SAST (Semgrep)       — passed"
          echo "✅ Secrets (Gitleaks)   — passed"
          echo "✅ Dependencies (Trivy) — passed"
          echo "✅ Docker image (Trivy) — passed"
          echo "✅ Non-root container   — verified"
          echo "============================================"
          echo "Pipeline is GREEN — safe to deploy"