# ============================================================
# .gitlab-ci.yml — Шаг 3: Управление секретами
# Gitleaks сканирует код и всю git-историю
# Найдены секреты → pipeline падает, коммит блокируется
# ============================================================

stages:
  - secrets-scan
  - secrets-audit
  - vault-check
  - report

variables:
  GITLEAKS_VERSION: "8.18.2"

# ── 1. Gitleaks — сканирование текущего кода ──────────────────────────────────
gitleaks-code:
  stage: secrets-scan
  image: zricethezav/gitleaks:v8.18.2
  script:
    - echo "=== Scanning current code for secrets ==="

    # Сканируем весь репозиторий с кастомным конфигом
    - gitleaks detect
        --source=.
        --config=.gitleaks.toml
        --report-format=json
        --report-path=gitleaks-code-report.json
        --verbose
        || (echo "❌ Secrets found in code — pipeline BLOCKED" && exit 1)

    - echo "✅ No secrets in current code"

  artifacts:
    when: always
    paths:
      - gitleaks-code-report.json
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

# ── 2. Gitleaks — сканирование ВСЕЙ git-истории ───────────────────────────────
gitleaks-history:
  stage: secrets-scan
  image: zricethezav/gitleaks:v8.18.2
  variables:
    GIT_DEPTH: 0          # Клонируем полную историю, не shallow clone
  script:
    - echo "=== Scanning full git history for secrets ==="
    - echo "Total commits to scan:"
    - git rev-list --count HEAD

    # Сканируем ВСЮ историю коммитов
    - gitleaks detect
        --source=.
        --config=.gitleaks.toml
        --log-opts="--all"
        --report-format=json
        --report-path=gitleaks-history-report.json
        --verbose
        || (echo "❌ Secrets found in git history — needs remediation" && exit 1)

    - echo "✅ No secrets found in git history"

  artifacts:
    when: always
    paths:
      - gitleaks-history-report.json
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

# ── 3. Проверка .env в .gitignore ─────────────────────────────────────────────
check-gitignore:
  stage: secrets-audit
  image: alpine:latest
  script:
    - echo "=== Checking .gitignore and .env files ==="

    # .env не должен быть в репозитории
    - |
      if git ls-files --error-unmatch .env 2>/dev/null; then
        echo "❌ .env file is tracked by git — REMOVE IT IMMEDIATELY"
        echo "Run: git rm --cached .env && echo '.env' >> .gitignore"
        exit 1
      else
        echo "✅ .env is NOT tracked by git"
      fi

    # .gitignore должен содержать .env
    - |
      if grep -q "^\.env$" .gitignore 2>/dev/null; then
        echo "✅ .gitignore contains .env"
      else
        echo "❌ .gitignore does NOT contain .env"
        exit 1
      fi

    # .env.example должен существовать (шаблон без реальных значений)
    - |
      if [ -f ".env.example" ]; then
        echo "✅ .env.example exists"
        # Проверяем что в .env.example нет реальных секретов (только CHANGE_ME)
        if grep -vE "(CHANGE_ME|your-|example|placeholder|<|>|^#|^$)" .env.example | grep -E "=.{8,}" | grep -vE "=https?://"; then
          echo "⚠️  WARNING: .env.example may contain real values — review manually"
        else
          echo "✅ .env.example contains only placeholders"
        fi
      else
        echo "❌ .env.example is missing — add template for developers"
        exit 1
      fi

    # Ищем возможные .env файлы которые случайно могли попасть в репо
    - |
      echo "Checking for accidentally committed secret files..."
      for f in .env .env.local .env.production .env.staging secrets.yml secrets.json; do
        if git ls-files "$f" 2>/dev/null | grep -q .; then
          echo "❌ Found tracked secret file: $f"
          exit 1
        fi
      done
      echo "✅ No secret files tracked in git"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

# ── 4. Проверка захардкоженных паттернов в коде ───────────────────────────────
check-hardcoded-patterns:
  stage: secrets-audit
  image: python:3.11-slim
  script:
    - echo "=== Checking for hardcoded secret patterns in source code ==="

    - |
      python3 << 'PYEOF'
      import re, sys, os
      from pathlib import Path

      # Паттерны захардкоженных секретов
      PATTERNS = [
          (r'(?i)password\s*=\s*["\'][^"\']{6,}["\']',      "Hardcoded password"),
          (r'(?i)secret[_-]?key\s*=\s*["\'][^"\']{8,}["\']',"Hardcoded secret key"),
          (r'(?i)api[_-]?key\s*=\s*["\'][^"\']{8,}["\']',   "Hardcoded API key"),
          (r'(?i)token\s*=\s*["\'][^"\']{8,}["\']',          "Hardcoded token"),
          (r'AKIA[0-9A-Z]{16}',                               "AWS Access Key ID"),
          (r'(?i)aws.{0,20}secret.{0,20}=\s*["\'][^"\']+["\']', "AWS Secret"),
          (r'postgresql://[^:]+:[^@]+@',                      "DB URL with password"),
          (r'mysql://[^:]+:[^@]+@',                           "MySQL URL with password"),
          (r'ghp_[A-Za-z0-9]{36}',                           "GitHub Personal Token"),
      ]

      # Файлы для проверки (исключаем уязвимый файл-демо и тесты)
      EXCLUDE = {
          "main_vulnerable.py",   # намеренно уязвимый файл
          ".env.example",         # шаблон
          "generate_report.py",   # скрипт отчёта
      }

      issues = []
      for path in Path("app").rglob("*.py"):
          if path.name in EXCLUDE:
              continue
          text = path.read_text(encoding="utf-8", errors="ignore")
          for i, line in enumerate(text.splitlines(), 1):
              for pattern, label in PATTERNS:
                  if re.search(pattern, line):
                      # Исключаем строки с os.environ
                      if "os.environ" not in line and "os.getenv" not in line:
                          issues.append(f"  {path}:{i} [{label}] {line.strip()[:80]}")

      if issues:
          print(f"❌ Found {len(issues)} hardcoded secret(s):")
          for iss in issues:
              print(iss)
          sys.exit(1)
      else:
          print("✅ No hardcoded secrets found in source code")
      PYEOF

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

# ── 5. Проверка доступности HashiCorp Vault ───────────────────────────────────
vault-connectivity:
  stage: vault-check
  image: alpine:latest
  before_script:
    - apk add --no-cache curl -q
  script:
    - echo "=== Checking HashiCorp Vault connectivity ==="

    # Vault URL берётся из GitLab CI/CD Variables (Settings → CI/CD → Variables)
    - |
      if [ -z "$VAULT_ADDR" ]; then
        echo "⚠️  VAULT_ADDR not set — skipping Vault check"
        echo "Set VAULT_ADDR in GitLab: Settings → CI/CD → Variables"
        exit 0
      fi

    - |
      HEALTH=$(curl -sf "$VAULT_ADDR/v1/sys/health" || echo "unreachable")
      if echo "$HEALTH" | grep -q '"initialized":true'; then
        echo "✅ Vault is reachable and initialized: $VAULT_ADDR"
      else
        echo "⚠️  Vault not reachable at $VAULT_ADDR"
        echo "Make sure Vault is running: docker-compose up -d vault"
      fi

    # Пробуем получить секрет из Vault (если токен настроен)
    - |
      if [ -n "$VAULT_TOKEN" ]; then
        SECRET=$(curl -sf -H "X-Vault-Token: $VAULT_TOKEN" \
          "$VAULT_ADDR/v1/secret/data/app" | grep -c '"data"' || echo "0")
        if [ "$SECRET" -gt "0" ]; then
          echo "✅ App secrets accessible from Vault"
        else
          echo "⚠️  Could not read secrets from Vault — check VAULT_TOKEN"
        fi
      else
        echo "ℹ️  VAULT_TOKEN not set — skipping secret read test"
      fi

  allow_failure: true   # Vault может быть недоступен в тестовой среде
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

# ── 6. Итоговый отчёт ─────────────────────────────────────────────────────────
secrets-summary:
  stage: report
  image: alpine:latest
  needs:
    - gitleaks-code
    - gitleaks-history
    - check-gitignore
    - check-hardcoded-patterns
  script:
    - echo "============================================"
    - echo "✅ Secrets scan — PASSED"
    - echo "============================================"
    - echo "✅ Gitleaks (current code)   — no secrets"
    - echo "✅ Gitleaks (git history)    — no secrets"
    - echo "✅ .env in .gitignore        — confirmed"
    - echo "✅ Hardcoded patterns check  — clean"
    - echo "============================================"
    - echo "Secrets management: COMPLIANT"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'