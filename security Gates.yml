# ============================================================
# .github/workflows/security.yml — Шаг 4: CI/CD Security Gates
# Запускается при каждом push и pull_request в main
#
# Gates:
#   SAST (Semgrep)      — Critical findings  → pipeline падает
#   Secrets (Gitleaks)  — найден секрет      → pipeline падает
#   Deps (Trivy)        — Critical CVE       → pipeline падает
#   Docker image (Trivy)— Critical CVE       → pipeline падает
# ============================================================

name: Security Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Минимальные права по умолчанию
permissions:
  contents: read
  security-events: write   # для загрузки SARIF в GitHub Security tab

# Отменяем предыдущий запуск если пришёл новый push
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. SAST — Semgrep ────────────────────────────────────────────────────────
  sast:
    name: "SAST — Semgrep"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (local rules)
        run: |
          echo "=== Running Semgrep SAST ==="
          semgrep \
            --config=.semgrep.yml \
            --json \
            --output=semgrep-results.json \
            app/ || true

          # Показываем читаемый вывод
          semgrep --config=.semgrep.yml app/ || true

          # GATE: падаем если есть ERROR (Critical)
          CRITICAL=$(python3 -c "
          import json
          data = json.load(open('semgrep-results.json'))
          crit = [r for r in data.get('results',[]) if r['extra']['severity']=='ERROR']
          print(len(crit))
          ")
          echo "Critical findings: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "❌ $CRITICAL Critical finding(s) — pipeline BLOCKED"
            exit 1
          fi
          echo "✅ No Critical findings — SAST gate passed"

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-results.json
          retention-days: 7

  # ── 2. Secrets — Gitleaks ────────────────────────────────────────────────────
  secrets:
    name: "Secrets — Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история для сканирования всех коммитов

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gitleaks возвращает exit-code 1 при находке → pipeline падает

      - name: Check .env not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ .env is tracked by git — remove it!"
            exit 1
          fi
          grep -q "^\.env$" .gitignore \
            && echo "✅ .env is in .gitignore" \
            || (echo "❌ .env missing from .gitignore" && exit 1)

  # ── 3. Dependency Scan — Trivy ───────────────────────────────────────────────
  dependency-scan:
    name: "Dependencies — Trivy"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          severity: "CRITICAL,HIGH"
          exit-code: "1"        # GATE: падаем при Critical/High CVE
          format: table

      - name: Save JSON report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          severity: "CRITICAL,HIGH,MEDIUM"
          format: json
          output: trivy-deps.json

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-dependency-report
          path: trivy-deps.json
          retention-days: 7

  # ── 4. Docker Build + Image Scan ─────────────────────────────────────────────
  docker-scan:
    name: "Docker — Build & Image Scan"
    runs-on: ubuntu-latest
    needs: [sast, secrets, dependency-scan]   # только после прохождения gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t secureapp:${{ github.sha }} .
          echo "✅ Image built: secureapp:${{ github.sha }}"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secureapp:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"        # GATE: падаем при Critical/High в образе
          format: sarif
          output: trivy-image.sarif

      - name: Upload image SARIF → GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif

      - name: Verify non-root user
        run: |
          USER=$(docker run --rm secureapp:${{ github.sha }} whoami)
          echo "Container user: $USER"
          [ "$USER" != "root" ] \
            && echo "✅ Non-root confirmed: $USER" \
            || (echo "❌ Container runs as root!" && exit 1)

  # ── 5. Summary — все gates прошли ────────────────────────────────────────────
  pipeline-passed:
    name: "✅ All Security Gates Passed"
    runs-on: ubuntu-latest
    needs: [sast, secrets, dependency-scan, docker-scan]
    if: success()
    steps:
      - name: Print summary
        run: |
          echo "============================================"
          echo "✅ SAST (Semgrep)        — passed"
          echo "✅ Secrets (Gitleaks)    — passed"
          echo "✅ Dependencies (Trivy)  — passed"
          echo "✅ Docker image (Trivy)  — passed"
          echo "✅ Non-root container    — verified"
          echo "============================================"
          echo "Pipeline GREEN — safe to deploy"

      - name: Create pipeline badge summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ Security Pipeline — PASSED

          | Gate | Tool | Result |
          |------|------|--------|
          | SAST | Semgrep | ✅ 0 Critical findings |
          | Secrets | Gitleaks | ✅ 0 secrets detected |
          | Dependencies | Trivy | ✅ 0 Critical/High CVE |
          | Docker image | Trivy | ✅ 0 Critical/High CVE |
          | Non-root container | Docker | ✅ Verified |
          EOF