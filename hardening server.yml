## 5. fail2ban

### 5.1 Основной конфиг

```bash
# Создать локальный конфиг (переопределяет /etc/fail2ban/jail.conf)
cat > /etc/fail2ban/jail.local << 'EOF'
[DEFAULT]
# Банить на 1 час
bantime  = 3600
# Окно проверки — 10 минут
findtime = 600
# Максимум попыток
maxretry = 5
backend  = auto

[sshd]
enabled  = true
port     = 2222
filter   = sshd
logpath  = /var/log/auth.log
# Для SSH — строже: 3 попытки, бан на 24 часа
maxretry = 3
bantime  = 86400

[nginx-http-auth]
enabled  = true
port     = http,https
filter   = nginx-http-auth
logpath  = /var/log/nginx/error.log

[nginx-limit-req]
enabled  = true
port     = http,https
filter   = nginx-limit-req
logpath  = /var/log/nginx/error.log
maxretry = 10

[nginx-botsearch]
enabled  = true
port     = http,https
filter   = nginx-botsearch
logpath  = /var/log/nginx/access.log
maxretry = 5
EOF

# Включить и запустить
systemctl enable fail2ban
systemctl restart fail2ban

# Проверить статус
fail2ban-client status
fail2ban-client status sshd
```

