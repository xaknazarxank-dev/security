Расписал все по порядку 


## 1. Первичная подготовка системы

```bash
# Обновить все пакеты
apt-get update && apt-get upgrade -y

# Установить нужные утилиты
apt-get install -y ufw fail2ban nginx curl wget git unzip
```

---

## 2. Создать отдельного пользователя для приложения

```bash
# Создать системного пользователя без логина (не root, без домашней директории)
useradd --system \
        --no-create-home \
        --shell /sbin/nologin \
        appuser

# Проверить что пользователь создан
id appuser
# uid=999(appuser) gid=999(appuser) groups=999(appuser)

# Создать директории приложения и отдать их appuser
mkdir -p /app/data /app/logs
chown -R appuser:appuser /app
chmod 750 /app
chmod 750 /app/data
chmod 750 /app/logs

# Проверить права
ls -la /app
```

