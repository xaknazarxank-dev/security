## Порядок выполнения

```
1. apt update && upgrade
2. useradd appuser
3. SSH: добавить ключ → изменить конфиг → перезапустить
4. UFW: настроить правила → включить
5. fail2ban: создать jail.local → перезапустить
6. Nginx: создать конфиг → проверить → reload
7. Docker: собрать образ → проверить non-root → запустить
8. Логи: добавить фильтр → проверить
9. sysctl: применить
10. Итоговая проверка чеклиста
