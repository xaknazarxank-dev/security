## 6. Nginx — security headers

### 6.1 Конфигурация

```bash
# Убрать стандартный конфиг
rm -f /etc/nginx/sites-enabled/default

# Создать конфиг приложения
cat > /etc/nginx/sites-available/app.conf << 'EOF'
# Скрыть версию Nginx
server_tokens off;

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m    rate=30r/m;
limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Только современные протоколы TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Security Headers ────────────────────────────────────────────────────
    # Защита от MITM — браузер всегда использует HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Запрет отображения в iframe (защита от Clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Запрет MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS-защита (старые браузеры)
    add_header X-XSS-Protection "1; mode=block" always;

    # Ограничение Referer-заголовка
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Запрет лишних возможностей браузера
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Скрыть заголовки backend
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # ── Логи без чувствительных данных ──────────────────────────────────────
    # Убраны query-параметры ($uri вместо $request) — могут содержать токены
    log_format secure '$remote_addr - [$time_local] '
                      '"$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';

    access_log /var/log/nginx/access.log secure;

    # ── Проксирование на приложение ──────────────────────────────────────────
    location / {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # Строгий rate limit для логина
    location /login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000/login;
    }

    # Запрет скрытых файлов (.env, .git и т.д.)
    location ~ /\. {
        deny all;
        return 404;
    }
}
EOF

# Активировать конфиг
ln -s /etc/nginx/sites-available/app.conf /etc/nginx/sites-enabled/

# Проверить конфиг
nginx -t && echo "Nginx config is valid"

# Применить
systemctl reload nginx
```

### 6.2 Проверка security headers

```bash
