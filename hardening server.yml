## 3. Настройка SSH

### 3.1 Добавить свой публичный ключ (сделать ДО изменения конфига!)

```bash
# На своей локальной машине — сгенерировать ключ если нет
ssh-keygen -t ed25519 -C "devsecops@yourdomain.com"

# Скопировать публичный ключ на сервер
ssh-copy-id -i ~/.ssh/id_ed25519.pub root@YOUR_SERVER_IP

# Или вручную на сервере
mkdir -p ~/.ssh
chmod 700 ~/.ssh
echo "ssh-ed25519 AAAA...ваш_публичный_ключ..." >> ~/.ssh/authorized_keys
chmod 600 ~/.ssh/authorized_keys
```

### 3.2 Изменить конфигурацию SSH

```bash
# Создать hardening-конфиг (не трогаем основной /etc/ssh/sshd_config)
cat > /etc/ssh/sshd_config.d/99-hardening.conf << 'EOF'
# Нестандартный порт — усложняет автоматическое сканирование
Port 2222

# Запрет входа под root
PermitRootLogin no

# Только ключевая аутентификация (пароли запрещены)
PasswordAuthentication no
PubkeyAuthentication yes

# Дополнительные ограничения
PermitEmptyPasswords no
X11Forwarding no
AllowTcpForwarding no
MaxAuthTries 3
MaxSessions 5
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
Protocol 2
EOF

# Проверить конфиг на ошибки перед применением
sshd -t && echo "Config is valid"

# Применить
systemctl restart sshd

# ⚠️ ВАЖНО: не закрывать текущую сессию!
# Открыть НОВОЕ окно терминала и проверить вход:
# ssh -p 2222 -i ~/.ssh/id_ed25519 YOUR_USER@YOUR_SERVER_IP
```

