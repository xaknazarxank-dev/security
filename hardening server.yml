```bash
echo "=== Hardening Checklist ==="

# Пользователь приложения
id appuser && echo "✅ appuser exists"

# SSH порт
ss -tlnp | grep 2222 && echo "✅ SSH on port 2222"

# UFW
ufw status | grep -q "Status: active" && echo "✅ UFW active"

# fail2ban
systemctl is-active fail2ban && echo "✅ fail2ban running"

# Nginx
nginx -t 2>&1 | grep -q "successful" && echo "✅ Nginx config valid"

# Docker non-root
docker run --rm secureapp:latest whoami | grep -v root && echo "✅ Container non-root"

# Security headers
curl -sI http://localhost | grep -q "X-Frame-Options" && echo "✅ Security headers present"

echo "=== Checklist complete ==="
```

