## 8. Логи без чувствительных данных

### 8.1 Настройка Python логгера в приложении

```python
# app/logger.py
import logging
import re

class SensitiveDataFilter(logging.Filter):
    """Фильтр — удаляет пароли и токены из логов."""

    PATTERNS = [
        (re.compile(r'password=[^\s&]+',      re.IGNORECASE), 'password=***'),
        (re.compile(r'"password"\s*:\s*"[^"]+"', re.IGNORECASE), '"password": "***"'),
        (re.compile(r'token=[^\s&]+',          re.IGNORECASE), 'token=***'),
        (re.compile(r'Bearer\s+[A-Za-z0-9._-]+'), 'Bearer ***'),
        (re.compile(r'AKIA[0-9A-Z]{16}'),      'AWS_KEY_***'),
    ]

    def filter(self, record):
        message = record.getMessage()
        for pattern, replacement in self.PATTERNS:
            message = pattern.sub(replacement, message)
        record.msg = message
        record.args = ()
        return True

# Настроить логгер
logging.basicConfig(
    level=logging.INFO,
    format="%(asctime)s %(levelname)s %(name)s - %(message)s",
)
logger = logging.getLogger(__name__)
logger.addFilter(SensitiveDataFilter())
```

### 8.2 Проверка логов

```bash
# Посмотреть логи приложения
docker logs secureapp 2>&1 | tail -20

# Убедиться что паролей нет
docker logs secureapp 2>&1 | grep -iE "(password|token|secret|key)" \
  && echo "⚠️  Sensitive data in logs!" \
  || echo "✅ No sensitive data in logs"

# Логи Nginx — проверить формат
tail -20 /var/log/nginx/access.log
# Формат: IP - [дата] "METHOD /path HTTP/1.1" STATUS bytes "UA"
# Query-параметры НЕ должны попадать в лог
```

