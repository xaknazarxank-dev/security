## 7. Docker — non-root контейнер

### 7.1 Dockerfile

```dockerfile
# Многоэтапная сборка
FROM python:3.11-slim AS builder
WORKDIR /build
COPY requirements.txt .
RUN pip install --no-cache-dir --prefix=/install -r requirements.txt

FROM python:3.11-slim AS runtime

# Создать non-root пользователя
RUN groupadd --gid 1001 appgroup \
 && useradd  --uid 1001 \
             --gid appgroup \
             --no-create-home \
             --shell /sbin/nologin \
             appuser

WORKDIR /app
COPY --from=builder /install /usr/local
COPY app/ .
RUN chown -R appuser:appgroup /app

ENV PYTHONDONTWRITEBYTECODE=1 \
    PYTHONUNBUFFERED=1

EXPOSE 8000

# Переключиться на non-root
USER appuser

CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
```

### 7.2 Запустить и проверить

```bash
# Собрать образ
docker build -t secureapp:latest .

# Проверить что контейнер НЕ запускается от root
docker run --rm secureapp:latest whoami
# Ожидаемый вывод: appuser

# Проверить UID
docker run --rm secureapp:latest id
# uid=1001(appuser) gid=1001(appgroup) groups=1001(appgroup)

# Запустить через docker-compose
docker-compose up -d

# Проверить запущенные контейнеры
docker ps
docker inspect secureapp | grep -i user
```

